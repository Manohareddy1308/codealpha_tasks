<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | ShopEase</title><link rel="stylesheet" href="style/style.css"></head>
<body><header class="navbar"><a href="index.html" class="logo">Shop<span>Ease</span></a><nav class="nav-links"><a class="nav-link" href="index.html#products">Shop</a></nav><div class="navbar-right"><a class="btn btn-secondary" href="cart.html">Cart</a></div></header>
<main class="page-shell"><form id="authForm" class="form-card" data-mode="register"><h1>Create your account</h1><p class="form-intro">Join ShopEase to place orders and track purchases.</p>
<div class="form-field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required maxlength="120"></div>
<div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="190"></div>
<div class="form-field"><label for="password">Password (at least 8 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></div>
<div id="formNotice" class="notice" role="status"></div><button class="btn btn-primary full-width" type="submit">Create Account</button><p class="form-footer">Already registered? <a href="login.html">Log in</a></p></form></main>
<footer class="site-footer-simple">© 2026 ShopEase</footer><script src="js/app.js"></script></body></html>
